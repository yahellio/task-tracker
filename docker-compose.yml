services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/task_tracker
      APP_URL: http://localhost:8080
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Трекер задач <no-reply@task-tracker.local>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@task-tracker.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
  uploads:
